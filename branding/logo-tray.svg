<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256">
  <!--
    ThixLauncher tray / menu bar glyph (16-22 px): one colour, no tile. On macOS it is a template image (black + alpha; the
    menu bar colours it), on Windows the app draws the colour icon instead. Three tiles and a play sign in the fourth place.
  -->
  <rect x="20" y="20" width="96" height="96" rx="26" fill="#000000"/>
  <rect x="140" y="20" width="96" height="96" rx="26" fill="#000000"/>
  <rect x="20" y="140" width="96" height="96" rx="26" fill="#000000"/>
  <path d="M158 156v64l62-32z" fill="#000000" stroke="#000000" stroke-width="16" stroke-linejoin="round"/>
</svg>
